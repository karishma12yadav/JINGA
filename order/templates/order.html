{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothora - Order</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        /* Navbar */
        nav {
            background: #111;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        /* Main */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .title p {
            color: #777;
        }

        .order-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        /* Product Summary */
        .product-summary,
        .order-form {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .product-summary h2,
        .order-form h2 {
            margin-bottom: 20px;
        }

        .product {
            display: flex;
            gap: 20px;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 20px;
        }

        .product img {
            width: 130px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-info h3 {
            margin-bottom: 10px;
        }

        .product-info p {
            color: #777;
            margin-bottom: 8px;
        }

        .price {
            font-size: 21px;
            font-weight: bold;
        }

        /* Quantity */
        .quantity {
            margin-top: 20px;
        }

        .quantity input {
            width: 70px;
            padding: 9px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Total */
        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Form */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: none;
            height: 90px;
        }

        /* Payment */
        .payment {
            margin-top: 20px;
        }

        .payment label {
            display: block;
            margin: 12px 0;
        }

        /* Button */
        .place-order {
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 15px;
        }

        .place-order:hover {
            background: #444;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Mobile */
        @media(max-width: 750px) {
            .order-container {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">CLOTHORA</div>

        <div>
            <a href="index.html">Home</a>
            <a href="index.html#products">Shop</a>
        </div>
    </nav>


    <!-- Order Page -->
    <div class="container">

        <div class="title">
            <h1>Complete Your Order</h1>
            <p>Enter your details to place your order</p>
        </div>


        <div class="order-container">

            <!-- Product Summary -->
            <div class="product-summary">

                <h2>Order Summary</h2>

                <div class="product">

                    <img
                        src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
                        alt="White T-Shirt">

                    <div class="product-info">

                        <h3>Classic White T-Shirt</h3>

                        <p>Premium Cotton</p>

                        <div class="price">
                            ₹599
                        </div>

                    </div>

                </div>


                <div class="quantity">

                    <label>Quantity</label><br>

                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                        onchange="calculateTotal()">

                </div>


                <div class="total">

                    <span>Total</span>

                    <span id="total">
                        ₹599
                    </span>

                </div>

            </div>


            <!-- Customer Form -->
            <div class="order-form">

                <h2>Customer Details</h2>

                <form onsubmit="placeOrder(event)">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label>Phone Number</label>

                        <input
                            type="tel"
                            placeholder="Enter phone number"
                            required>

                    </div>


                    <div class="form-group">

                        <label>Delivery Address</label>

                        <textarea
                            placeholder="Enter your complete address"
                            required></textarea>

                    </div>


                    <div class="form-group">

                        <label>City</label>

                        <input
                            type="text"
                            placeholder="Enter city"
                            required>

                    </div>


                    <div class="form-group">

                        <label>PIN Code</label>

                        <input
                            type="text"
                            placeholder="Enter PIN code"
                            required>

                    </div>


                    <!-- Payment -->
                    <div class="payment">

                        <h3>Payment Method</h3>

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="cod"
                                checked>
                            Cash on Delivery
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="online">
                            Online Payment
                        </label>

                    </div>

                    

                         <button
                        type="submit"
                        class="place-order">

                        
                        <a href="http://127.0.0.1:8000/order/placeorder/">
                            Place Order
                        </a>

                    </button>
                    
                   

                </form>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer>
        <p>© 2026 Clothora | All Rights Reserved</p>
    </footer>


    <script>

        const productPrice = 599;

        function calculateTotal() {

            const quantity =
                document.getElementById("quantity").value;

            const total =
                productPrice * quantity;

            document.getElementById("total").innerText =
                "₹" + total;

        }


        function placeOrder(event) {

            event.preventDefault();

            alert(
                "🎉 Order placed successfully!\n\n" +
                "Thank you for shopping with Clothora!"
            );

        }

    </script>

</body>
</html>
```
