
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clothora - Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
        }


        /* Navbar */

        nav {
            background: #111;
            color: white;

            padding: 18px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }


        /* Login Section */

        .login-section {

            min-height: calc(100vh - 70px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        /* Login Card */

        .login-card {

            background: white;

            width: 100%;
            max-width: 420px;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.1);
        }


        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #777;
            font-size: 14px;
        }


        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 15px;

            font-weight: bold;
        }

        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 6px;

            outline: none;

            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #111;
        }


        /* Password */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {

            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            color: #666;

            font-size: 14px;
        }


        /* Remember / Forgot */

        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

            font-size: 14px;
        }

        .remember {

            display: flex;

            align-items: center;

            gap: 7px;
        }

        .options a {

            color: #111;

            text-decoration: none;

            font-weight: bold;
        }


        /* Login Button */

        .login-btn {

            width: 100%;

            padding: 14px;

            background: #111;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: #444;
        }


        /* Divider */

        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 25px 0;

            color: #999;

            font-size: 14px;
        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #ddd;
        }


        /* Create Account */

        .register {

            text-align: center;

            font-size: 14px;

            color: #666;
        }

        .register a {

            color: #111;

            font-weight: bold;

            text-decoration: none;
        }


        /* Message */

        #message {

            display: none;

            margin-top: 15px;

            padding: 10px;

            background: #eee;

            border-radius: 5px;

            text-align: center;

            font-size: 14px;
        }


        /* Footer */

        footer {

            background: #111;

            color: white;

            text-align: center;

            padding: 18px;
        }


        /* Mobile */

        @media (max-width: 600px) {

            nav {
                padding: 16px 5%;
            }

            nav a {
                margin-left: 10px;
                font-size: 14px;
            }

            .logo {
                font-size: 23px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .login-header h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <!-- Navbar -->

    <nav>

        <div class="logo">
            CLOTHORA
        </div>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Shop
            </a>

        </div>

    </nav>



    <!-- Login -->

    <section class="login-section">

        <div class="login-card">


            <!-- Header -->

            <div class="login-header">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to your Clothora account
                </p>

            </div>



            <!-- Form -->

            <form onsubmit="login(event)">


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>



                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                        <span
                            class="show-password"
                            onclick="togglePassword()">

                            Show

                        </span>

                    </div>

                </div>



                <!-- Options -->

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox">

                        Remember me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>



                <!-- Login -->

                <button
                    type="submit"
                    class="login-btn">
                <a href="http://127.0.0.1:8000/">
                    Login
                </a>
                    

                </button>


                <div id="message">
                    Login successful!
                </div>


            </form>



            <!-- Divider -->

            <div class="divider">
                OR
            </div>



            <!-- Register -->

            <div class="register">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


        </div>

    </section>



    <!-- Footer -->

    <footer>

        <p>
            © 2026 Clothora | All Rights Reserved
        </p>

    </footer>



    <script>


        /* Show / Hide Password */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");


            if (password.type === "password") {

                password.type = "text";

                button.innerText = "Hide";

            }

            else {

                password.type = "password";

                button.innerText = "Show";

            }

        }



        /* Login */

        function login(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            if (email && password) {

                document.getElementById("message").style.display =
                    "block";

                document.getElementById("message").innerText =
                    "✓ Login successful!";

            }

        }

    </script>


</body>

</html>
